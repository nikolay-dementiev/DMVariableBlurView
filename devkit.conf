# The settings of this repository for DMDevKit, schema version 1. Tools/Package.swift pins the
# DMDevKit that reads them. This file is shell code that runs with the rights of whoever runs a
# script, so review a change to it like any other code.
#
# The commands read these names: check-lint-contract SOURCE_DIR, RULES and FIXTURE_DIR; check-api
# MODULE, SOURCE_DIR, SWIFT_FLAGS, LIBRARY_EVOLUTION, DEPENDENCIES and PREPARE; check-release
# FROZEN_POD_VERSION and MODULE, which names the podspec; check-wrappers WRAPPERS, the scripts of
# Scripts/ that forward to devkit, each one named by its file. A few values are also written
# elsewhere, and no check compares them with this file, so change both: MODULE in
# Scripts/check-manifest.sh, which does not run devkit; SWIFT_FLAGS in Package.swift and in the
# compiler call of the floor job of ci.yml; SOURCE_DIR in that job and in .swiftlint.yml.
DEVKIT_CONF_VERSION=1
MODULE="DMVariableBlurView"
SOURCE_DIR="Sources/DMVariableBlurView"
RULES="domain_imports force_cast force_try force_unwrapping implicitly_unwrapped_optional no_process_termination"
FIXTURE_DIR="Fixtures/Lint"
SWIFT_FLAGS=(-swift-version 6 -enable-upcoming-feature ExistentialAny)
LIBRARY_EVOLUTION="yes"
FROZEN_POD_VERSION="1.1.0"
DEPENDENCIES=()
PREPARE=()
WRAPPERS=(lint.sh check-lint-contract.sh check-lint-tool.sh prepare-simulator.sh check-api.sh check-release.sh export-coverage.sh count-tests.sh check-wrappers.sh)
