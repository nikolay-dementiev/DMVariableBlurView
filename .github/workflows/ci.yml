name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # The release workflow runs this workflow on a version tag.
  workflow_call:
  # An early warning when a new runner image or iOS version breaks the package. The day is not the
  # one of the author's other packages: the macOS jobs of one account run five at a time.
  schedule:
    - cron: "17 5 * * 2"

permissions:
  contents: read

# A newer commit of a pull request replaces the run of the older one. Every other run has
# a group of its own: GitHub keeps one pending run per group and drops the others, so a
# shared group would lose runs of main even without cancelling.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which jobs a change needs. Scripts/ci-changes.sh decides, for two groups: the heavy jobs
  # (test, example and thread-sanitizer), which build and test the code on simulators, and
  # the light ones (lint, docs, api and consumer). A pull request or a push to main that
  # changes documents only skips the heavy jobs, and one that changes only files that no job reads
  # skips both groups. Any other event runs every job: a tag, a schedule, a manual run and the
  # release. A job runs when this job fails or gives no answer, so a fault here costs time and
  # never skips a check.
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      light: ${{ steps.filter.outputs.light }}
      heavy: ${{ steps.filter.outputs.heavy }}
    steps:
      # The whole history, so that the commit the change is based on is there to compare with.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # A filter that never skips looks the same as one that is right, so its rules are tried on
      # lists of paths that must skip and on lists that must not, on every run, before the real one.
      - name: Check the change filter
        run: Scripts/ci-changes.sh --self-test
      # The script lists the paths in this log, and a rename lists both: the old one may be code that
      # the new one hides. A diff that fails is a warning and runs every job, so that a diff that
      # always fails does not end the saving with no sign. The base is the one a pull request is
      # based on, or the commit main was at before a push; a tag, a schedule and a manual run have
      # no use for it and are not filtered.
      - name: List what the change touches
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -o pipefail
          Scripts/ci-changes.sh "$EVENT" "$BASE" "$REF" | tee -a "$GITHUB_OUTPUT"

  lint:
    name: lint
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.light != 'skip' }}
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore the tools build
        uses: ./.github/actions/tools-cache
      - name: Lint
        run: Scripts/lint.sh
      # A rule that never matches reports nothing, so the fixtures prove that each one fires.
      - name: Check that the lint rules fire
        run: Scripts/check-lint-contract.sh
      # Two runs at once on one checkout must not break each other while the tool is fetched.
      - name: Check that the lint tool is fetched safely
        run: Scripts/check-lint-tool.sh
      # The scripts that forward to devkit are code that nothing else tests: one that dropped its
      # arguments or its status would pass every other check. This step runs devkit itself and not
      # Scripts/check-wrappers.sh: that wrapper is one of the scripts checked, and one that
      # forwarded to another command would turn the step into that command and leave it green.
      - name: Check that the wrappers forward to devkit
        run: swift run --quiet --package-path Tools devkit check-wrappers

  test:
    name: test (${{ matrix.name }})
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.heavy != 'skip' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iOS 26.5
            runner: macos-26
            xcode: /Applications/Xcode_26.6.app
            device: iPhone 17
            os: "26.5"
    env:
      DEVELOPER_DIR: ${{ matrix.xcode }}/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The tools are restored first: the script that boots the simulator calls devkit, and a build
      # of devkit there would delay the boot.
      - name: Restore the tools build
        uses: ./.github/actions/tools-cache
      # The simulator boots while the package builds: the build does not need it, and the boot is
      # one of the longest steps of the job. The script boots the device, waits for it and prints
      # its udid, which the Wait step reads. Every descriptor of the process goes to a file, so
      # that this step does not wait for it. The udid names the device, not a name and an OS: a
      # hosted image can list a runtime with no device in it, and the script creates the device then.
      - name: Start the simulator
        env:
          DEVICE: ${{ matrix.device }}
          OS: ${{ matrix.os }}
        run: |
          sim="$RUNNER_TEMP/sim"
          mkdir -p "$sim"
          {
            status=0
            Scripts/prepare-simulator.sh "$DEVICE" "$OS" > "$sim/udid" 2> "$sim/log" || status=$?
            echo "$status" > "$sim/status"
          } > /dev/null 2>&1 < /dev/null &
      # The generic destination builds arm64 and x86_64 for the simulator, and ONLY_ACTIVE_ARCH does
      # not stop it. The runners and their simulators are arm64, and the destination with its udid
      # that this step replaced built that one only, so ARCHS keeps the build as short as it was.
      # Xcode compiles a dependency resolved by URL with its warnings suppressed, which the compiler
      # refuses beside warnings as errors. SWIFT_SUPPRESS_WARNINGS=NO ends that conflict, here and
      # in the release build below, so a warning of DMCore fails the build too.
      - name: Build the package for testing
        run: |
          set -o pipefail
          mkdir -p .build/results/ci
          xcodebuild clean build-for-testing \
            -scheme DMVariableBlurView \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -enableCodeCoverage YES \
            ARCHS=arm64 \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES SWIFT_SUPPRESS_WARNINGS=NO \
            | tee .build/results/ci/package.log
      # The rule that finds unused imports needs the compiler commands of a clean build. It reads
      # the log of the build and not the simulator, so it runs while the simulator still boots.
      - name: Find unused imports
        run: Scripts/lint.sh --analyze .build/results/ci/package.log
      - name: Wait for the simulator
        run: |
          sim="$RUNNER_TEMP/sim"
          for _ in $(seq 1 600); do [ -f "$sim/status" ] && break; sleep 1; done
          cat "$sim/log" >&2
          [ -f "$sim/status" ] && [ "$(cat "$sim/status")" = 0 ] || { echo "The simulator did not boot." >&2; exit 1; }
          echo "SIMULATOR=$(cat "$sim/udid")" >> "$GITHUB_ENV"
      - name: Test the package
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -scheme DMVariableBlurView \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIMULATOR" \
            -enableCodeCoverage YES \
            -resultBundlePath .build/results/ci/package.xcresult \
            | tee -a .build/results/ci/package.log
      # A run that lost a test class, or has a test that skips itself, passes the test step above: the
      # bundle feeds the coverage floor only, and the tests it loses may not move the coverage. So
      # every test method of Tests must be in the bundle, run and passed. Two
      # tests skip themselves when Reduce Transparency is on, a setting that a default simulator
      # does not have, and that fails here.
      - name: Check the test count
        run: Scripts/count-tests.sh --label package .build/results/ci/package.xcresult 'Tests/*.swift'
      # The tests run in Debug. This build proves that the release configuration compiles.
      - name: Build the library for release
        run: |
          xcodebuild build \
            -scheme DMVariableBlurView \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES SWIFT_SUPPRESS_WARNINGS=NO
      # The floor was measured with the toolchain of this job, Xcode 26.6.
      - name: Check the coverage floor
        run: Scripts/coverage-gate.sh .build/results/ci/package.xcresult
      - name: Export library coverage
        run: Scripts/export-coverage.sh .build/results/ci/package.xcresult DMVariableBlurView "$RUNNER_TEMP/coverage.lcov"
      - name: Upload coverage to Codecov
        # Forks and Dependabot cannot request the OIDC credentials used for this upload.
        if: github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        # Codecov is a report, not a gate: an outage or a failed token request must not fail the job.
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: ${{ runner.temp }}/coverage.lcov
          disable_search: true
          plugins: noop
          disable_file_fixes: true
          fail_ci_if_error: false
          name: library-${{ matrix.name }}
      - name: Upload the result bundle
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-${{ matrix.runner }}-xcresult
          path: .build/results/ci/package.xcresult

  thread-sanitizer:
    # The package's tests under the Thread Sanitizer. The library has code that runs off
    # the main thread: a change of the Reduce Transparency setting can be posted on another
    # thread and is moved to the main actor, and a test posts it from another thread; the
    # failure handler runs in a task. Debug, no coverage, no example app.
    name: thread-sanitizer
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.heavy != 'skip' }}
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      # Measured on Xcode 26.6 and iOS 26.5, with a test that races on a global: with or without
      # this setting the sanitizer aborts the test process at the first report, the run starts it
      # again, and the job fails (exit 65, the racing test failed, the others passed). The setting
      # states what the job wants, so that it does not depend on what another Xcode does by default.
      TEST_RUNNER_TSAN_OPTIONS: halt_on_error=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore the tools build
        uses: ./.github/actions/tools-cache
      # The simulator boots while the package builds, as in the test job.
      - name: Start the simulator
        env:
          DEVICE: iPhone 17
          OS: "26.5"
        run: |
          sim="$RUNNER_TEMP/sim"
          mkdir -p "$sim"
          {
            status=0
            Scripts/prepare-simulator.sh "$DEVICE" "$OS" > "$sim/udid" 2> "$sim/log" || status=$?
            echo "$status" > "$sim/status"
          } > /dev/null 2>&1 < /dev/null &
      - name: Build the package for testing under the Thread Sanitizer
        run: |
          set -o pipefail
          mkdir -p .build/results/ci
          xcodebuild build-for-testing \
            -scheme DMVariableBlurView \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -enableThreadSanitizer YES \
            ARCHS=arm64 \
            | tee .build/results/ci/thread-sanitizer.log
      - name: Wait for the simulator
        run: |
          sim="$RUNNER_TEMP/sim"
          for _ in $(seq 1 600); do [ -f "$sim/status" ] && break; sleep 1; done
          cat "$sim/log" >&2
          [ -f "$sim/status" ] && [ "$(cat "$sim/status")" = 0 ] || { echo "The simulator did not boot." >&2; exit 1; }
          echo "SIMULATOR=$(cat "$sim/udid")" >> "$GITHUB_ENV"
      - name: Test the package under the Thread Sanitizer
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -scheme DMVariableBlurView \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIMULATOR" \
            -enableThreadSanitizer YES \
            -resultBundlePath .build/results/ci/thread-sanitizer.xcresult \
            | tee -a .build/results/ci/thread-sanitizer.log
      - name: Upload the result bundle
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: thread-sanitizer-xcresult
          path: .build/results/ci/thread-sanitizer.xcresult

  consumer:
    name: consumer
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.light != 'skip' }}
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A check that never fails looks the same as a clean tree, so its readers are tried on texts
      # that must fail before they are trusted with the real ones.
      - name: Check the readers of the manifest, of the README and of Package.resolved
        run: Scripts/check-manifest.sh --self-test
      - name: Check what a consumer gets
        run: Scripts/check-manifest.sh

  api:
    # The interface text depends on the compiler, so this job runs on one pinned Xcode.
    name: api
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.light != 'skip' }}
    runs-on: macos-26
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore the tools build
        uses: ./.github/actions/tools-cache
      - name: Check the normalisation of the interface
        run: Scripts/check-api.sh --self-test
      # The release check refuses a release on what it reads in the changelog, the tags and the
      # baselines. A check that never refuses looks the same as a clean tree, so its decisions are
      # tried on scratch repositories first.
      - name: Check the decisions of the release check
        run: Scripts/check-release.sh --self-test
      - name: Compare the public interface with the baseline
        run: Scripts/check-api.sh
      # What the pull request removes, changes or adds in the baseline, for the reviewer. The
      # comparison above is the one that fails; this step fails only when it cannot compare. The
      # text is indented as a code block: a line of a fork's baseline could close a fence.
      - name: Write the interface delta against the base to the job summary
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          status=0
          Scripts/check-api.sh --since "$BASE_SHA" > "$RUNNER_TEMP/delta.txt" 2>&1 || status=$?
          {
            echo "### Public interface against the base of the pull request"
            echo
            sed 's/^/    /' "$RUNNER_TEMP/delta.txt"
          } >> "$GITHUB_STEP_SUMMARY"
          case "$status" in
            0 | 3 | 4) ;;
            1)
              if ! grep -q '^Removed or changed' "$RUNNER_TEMP/delta.txt"; then
                cat "$RUNNER_TEMP/delta.txt" >&2
                exit 1
              fi
              ;;
            *)
              cat "$RUNNER_TEMP/delta.txt" >&2
              exit "$status"
              ;;
          esac

  docs:
    name: docs
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.light != 'skip' }}
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A broken symbol link is a warning to DocC and an error here.
      - name: Build the documentation
        run: |
          xcodebuild docbuild \
            -scheme DMVariableBlurView \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            OTHER_DOCC_FLAGS="--warnings-as-errors"

  example:
    name: example (${{ matrix.name }})
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.heavy != 'skip' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iOS 26.5
            runner: macos-26
            xcode: /Applications/Xcode_26.6.app
            device: iPhone 17
            os: "26.5"
            passed: 34
            skipped: 0
    env:
      DEVELOPER_DIR: ${{ matrix.xcode }}/Contents/Developer
      # xcodebuild hands a variable with this prefix to the test process without the
      # prefix. The snapshot tests see CI: they never record a reference. This device and
      # runtime have references, which must be compared: a missing one fails.
      TEST_RUNNER_CI: "true"
      TEST_RUNNER_SNAPSHOT_REFERENCES_REQUIRED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore the tools build
        uses: ./.github/actions/tools-cache
      # The device comes from the script, as in the test job, and boots while the example builds.
      - name: Start the simulator
        env:
          DEVICE: ${{ matrix.device }}
          OS: ${{ matrix.os }}
        run: |
          sim="$RUNNER_TEMP/sim"
          mkdir -p "$sim"
          {
            status=0
            Scripts/prepare-simulator.sh "$DEVICE" "$OS" > "$sim/udid" 2> "$sim/log" || status=$?
            echo "$status" > "$sim/status"
          } > /dev/null 2>&1 < /dev/null &
      # Only the committed package versions: a resolved file that no longer matches the
      # project fails here instead of being resolved again to whatever is newest.
      - name: Build the example for testing
        run: |
          set -o pipefail
          mkdir -p .build/results/ci
          xcodebuild build-for-testing \
            -project Examples/DMVariableBlurViewExample/DMVariableBlurViewExample.xcodeproj \
            -scheme DMVariableBlurViewExample \
            -destination 'generic/platform=iOS Simulator' \
            -onlyUsePackageVersionsFromResolvedFile \
            ARCHS=arm64 \
            | tee .build/results/ci/example.log
      # It reads the log of the build and not the simulator, so it runs while the simulator still boots.
      - name: Find unused imports
        run: Scripts/lint.sh --analyze .build/results/ci/example.log
      - name: Wait for the simulator
        run: |
          sim="$RUNNER_TEMP/sim"
          for _ in $(seq 1 600); do [ -f "$sim/status" ] && break; sleep 1; done
          cat "$sim/log" >&2
          [ -f "$sim/status" ] && [ "$(cat "$sim/status")" = 0 ] || { echo "The simulator did not boot." >&2; exit 1; }
          echo "SIMULATOR=$(cat "$sim/udid")" >> "$GITHUB_ENV"
      - name: Run the example tests
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project Examples/DMVariableBlurViewExample/DMVariableBlurViewExample.xcodeproj \
            -scheme DMVariableBlurViewExample \
            -destination "platform=iOS Simulator,id=$SIMULATOR" \
            -resultBundlePath .build/results/ci/example.xcresult \
            | tee -a .build/results/ci/example.log
      # A run that runs no test passes, and so does one that skips what it should run. The
      # numbers of the matrix are what the example has in this cell, so a lost test or a run that
      # skips everything fails here. A new example test changes them, in the same commit.
      - name: Check how many tests ran
        env:
          EXPECTED_PASSED: ${{ matrix.passed }}
          EXPECTED_SKIPPED: ${{ matrix.skipped }}
        run: |
          xcrun xcresulttool get test-results summary --path .build/results/ci/example.xcresult \
            > "$RUNNER_TEMP/example-summary.json"
          python3 - "$RUNNER_TEMP/example-summary.json" "$EXPECTED_PASSED" "$EXPECTED_SKIPPED" <<'PY'
          import json
          import sys

          summary = json.load(open(sys.argv[1]))
          expected = {"passedTests": int(sys.argv[2]), "skippedTests": int(sys.argv[3]), "failedTests": 0}
          actual = {key: summary.get(key) for key in expected}
          if actual != expected:
              print(f"example: the tests that ran are not the ones this cell expects: expected {expected}, got {actual}")
              sys.exit(1)
          print(f"example: {actual['passedTests']} tests passed and {actual['skippedTests']} were skipped, as expected.")
          PY
      # Xcode compiles a package dependency with its warnings suppressed, so the build
      # cannot turn warnings into errors as a whole. The library's own warnings fail the
      # test job; this step covers the sources of the example.
      - name: Fail on a warning in the example
        run: |
          warnings="$(grep -E "/Examples/[^:]*:[0-9]+:[0-9]+: warning:" .build/results/ci/example.log | sort -u || true)"
          if [ -n "$warnings" ]; then
            echo "$warnings"
            exit 1
          fi
      - name: Upload the result bundle
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: example-${{ matrix.runner }}-xcresult
          path: .build/results/ci/example.xcresult
