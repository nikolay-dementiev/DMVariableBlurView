name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # The release workflow runs this workflow on a version tag.
  workflow_call:
  # An early warning when a new runner image or iOS version breaks the package.
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

# A newer commit of a pull request replaces the run of the older one. Every other run has
# a group of its own: GitHub keeps one pending run per group and drops the others, so a
# shared group would lose runs of main even without cancelling.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint
        run: Scripts/lint.sh
      # A rule that never matches reports nothing, so the fixtures prove that each one fires.
      - name: Check that the lint rules fire
        run: Scripts/check-lint-contract.sh
      # Two runs at once on one checkout must not break each other while the tool is fetched.
      - name: Check that the lint tool is fetched safely
        run: Scripts/check-lint-tool.sh
      # The scripts that forward to devkit are code that nothing else tests: one that dropped its
      # arguments or its status would pass every other check. This step runs devkit itself and not
      # Scripts/check-wrappers.sh: that wrapper is one of the scripts checked, and one that
      # forwarded to another command would turn the step into that command and leave it green.
      - name: Check that the wrappers forward to devkit
        run: swift run --quiet --package-path Tools devkit check-wrappers

  test:
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iOS 26.5
            runner: macos-26
            xcode: /Applications/Xcode_26.6.app
            device: iPhone 17
            os: "26.5"
            newest: true
          - name: iOS 18.5
            runner: macos-15
            xcode: /Applications/Xcode_16.4.app
            device: iPhone 16
            os: "18.5"
            newest: false
    env:
      DEVELOPER_DIR: ${{ matrix.xcode }}/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The udid names the device, not a name and an OS: a hosted image can list a runtime with
      # no device in it, and the script creates the device then.
      - name: Prepare the simulator
        env:
          DEVICE: ${{ matrix.device }}
          OS: ${{ matrix.os }}
        run: |
          udid="$(Scripts/prepare-simulator.sh "$DEVICE" "$OS")"
          echo "SIMULATOR=$udid" >> "$GITHUB_ENV"
      - name: Build and test
        run: |
          set -o pipefail
          mkdir -p .build/results/ci
          xcodebuild clean build test \
            -scheme DMVariableBlurView \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIMULATOR" \
            -enableCodeCoverage YES \
            -resultBundlePath .build/results/ci/package.xcresult \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            | tee .build/results/ci/package.log
      # A run that lost a test class, or has a test that skips itself, passes the build above: the
      # bundle feeds the coverage floor only, which runs in one cell, and the tests it loses may not
      # move the coverage. So every test method of Tests must be in the bundle, run and passed. The
      # pattern allows attributes (also with arguments, such as @available(iOS 18, *)) and the
      # modifiers public, open, internal, final, override and nonisolated before func, and a test
      # that returns nothing. Two tests skip themselves when Reduce Transparency is on, a setting
      # that a default simulator does not have, and that fails here. The shell of a step has no
      # pipefail, so a git grep that fails gives 0, which the check below refuses.
      - name: Check the test count
        run: |
          EXPECTED="$(git grep -hcE '^[[:space:]]*((@[[:alnum:]_]+(\([^)]*\))?|public|open|internal|final|override|nonisolated)[[:space:]]+)*func[[:space:]]+test[[:alnum:]_]*[[:space:]]*\(\)[[:space:]]*(async[[:space:]]*)?(throws[[:space:]]*)?(\{.*|//.*)?$' -- 'Tests/*.swift' \
            | awk '{ total += $1 } END { print total + 0 }')"
          xcrun xcresulttool get test-results summary --path .build/results/ci/package.xcresult \
            > "$RUNNER_TEMP/package-summary.json"
          python3 - "$RUNNER_TEMP/package-summary.json" "$EXPECTED" <<'PY'
          import json
          import sys

          summary = json.load(open(sys.argv[1]))
          expected = int(sys.argv[2])
          wanted = {"passedTests": expected, "failedTests": 0, "skippedTests": 0}
          actual = {key: summary.get(key) for key in wanted}
          if expected == 0 or actual != wanted:
              print(f"package: the tests that ran are not the {expected} test methods of Tests: expected {wanted}, got {actual}")
              sys.exit(1)
          print(f"package: all {expected} tests ran and passed.")
          PY
      # The rule that finds unused imports needs the compiler commands of a clean build.
      - name: Find unused imports
        if: matrix.newest
        run: Scripts/lint.sh --analyze .build/results/ci/package.log
      # The tests run in Debug. This build proves that the release configuration compiles.
      - name: Build the library for release
        if: matrix.newest
        run: |
          xcodebuild build \
            -scheme DMVariableBlurView \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES
      # The floor was measured with the toolchain of this cell, Xcode 26.6.
      - name: Check the coverage floor
        if: matrix.newest
        run: Scripts/coverage-gate.sh .build/results/ci/package.xcresult
      - name: Check the coverage exporter
        run: python3 -B Scripts/test-export-coverage.py
      - name: Export library coverage
        run: python3 Scripts/export-coverage.py .build/results/ci/package.xcresult DMVariableBlurView "$RUNNER_TEMP/coverage.lcov"
      - name: Upload coverage to Codecov
        # Forks and Dependabot cannot request the OIDC credentials used for this upload.
        if: github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        # Codecov is a report, not a gate: an outage or a failed token request must not fail the job.
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: ${{ runner.temp }}/coverage.lcov
          disable_search: true
          plugins: noop
          disable_file_fixes: true
          fail_ci_if_error: false
          name: library-${{ matrix.name }}
      - name: Upload the result bundle
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-${{ matrix.runner }}-xcresult
          path: .build/results/ci/package.xcresult

  thread-sanitizer:
    # The package's tests under the Thread Sanitizer. The library has code that runs off
    # the main thread: a change of the Reduce Transparency setting can be posted on another
    # thread and is moved to the main actor, and a test posts it from another thread; the
    # failure handler runs in a task. Debug, no coverage, no example app.
    name: thread-sanitizer
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      # Measured on Xcode 26.6 and iOS 26.5, with a test that races on a global: with or without
      # this setting the sanitizer aborts the test process at the first report, the run starts it
      # again, and the job fails (exit 65, the racing test failed, the others passed). The setting
      # states what the job wants, so that it does not depend on what another Xcode does by default.
      TEST_RUNNER_TSAN_OPTIONS: halt_on_error=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare the simulator
        env:
          DEVICE: iPhone 17
          OS: "26.5"
        run: |
          udid="$(Scripts/prepare-simulator.sh "$DEVICE" "$OS")"
          echo "SIMULATOR=$udid" >> "$GITHUB_ENV"
      - name: Test the package under the Thread Sanitizer
        run: |
          set -o pipefail
          mkdir -p .build/results/ci
          xcodebuild test \
            -scheme DMVariableBlurView \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIMULATOR" \
            -enableThreadSanitizer YES \
            -resultBundlePath .build/results/ci/thread-sanitizer.xcresult \
            | tee .build/results/ci/thread-sanitizer.log
      - name: Upload the result bundle
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: thread-sanitizer-xcresult
          path: .build/results/ci/thread-sanitizer.xcresult

  floor:
    # The oldest toolchain the tools version of Package.swift promises: Swift 6.0.
    #
    # What it proves: the manifest loads with the SwiftPM of Swift 6.0, and the sources of
    # the library compile with the Swift 6.0 compiler of Xcode 16.0 against its iOS
    # simulator SDK, optimized, in the language mode, for the platform and with the
    # upcoming feature the manifest declares, warnings as errors. Object code is generated,
    # so the diagnostics that run after type checking run too. What it does not prove:
    # nothing is linked and no test runs here; the test job does that with newer toolchains.
    #
    # The compiler is called directly, as devkit check-api does, because it needs the
    # SDK only. An xcodebuild destination of Xcode 16.0 needs a simulator platform that the
    # runners of this image do not always offer ("iOS 18.0 is not installed").
    name: floor
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check that the compiler is Swift 6.0
        run: |
          xcrun swiftc --version | tee "$RUNNER_TEMP/swiftc-version.txt"
          grep -qE 'Apple Swift version 6\.0([. ]|$)' "$RUNNER_TEMP/swiftc-version.txt"
      # Tools/Package.swift is tools 6.0 like the package, and DMDevKit has to build with the oldest
      # compiler that the manifest promises. The other jobs run the tools on newer Xcode versions.
      - name: Build the tools with Swift 6.0
        run: |
          swift --version
          swift run --quiet --package-path Tools devkit --version
      # The flags of the next step repeat the manifest. A changed manifest fails here, so
      # the flags cannot drift from it unnoticed.
      - name: Load the manifest and compare it with the compiler flags
        run: |
          xcrun swift package dump-package > "$RUNNER_TEMP/manifest.json"
          python3 - "$RUNNER_TEMP/manifest.json" <<'PY'
          import json
          import sys

          manifest = json.load(open(sys.argv[1]))
          problems = []
          modes = manifest.get("swiftLanguageVersions") or manifest.get("swiftLanguageModes")
          if modes != ["6"]:
              problems.append(f"language modes {modes}; the job compiles with -swift-version 6")
          ios = [entry.get("version") for entry in manifest.get("platforms", []) if entry.get("platformName") == "ios"]
          if ios != ["17.0"]:
              problems.append(f"iOS versions {ios}; the job compiles for iOS 17.0")
          target = next((entry for entry in manifest.get("targets", []) if entry.get("name") == "DMVariableBlurView"), None)
          if target is None:
              problems.append("no target DMVariableBlurView")
          else:
              if target.get("path") or target.get("sources") or target.get("exclude"):
                  problems.append("custom source paths; the job compiles Sources/DMVariableBlurView")
              settings = target.get("settings") or []
              features = [setting.get("kind", {}).get("enableUpcomingFeature", {}).get("_0") for setting in settings]
              if features != ["ExistentialAny"]:
                  problems.append(f"swift settings {settings}; the job enables the upcoming feature ExistentialAny only")
          for problem in problems:
              print(f"floor: the manifest no longer matches the compiler flags: {problem}")
          sys.exit(1 if problems else 0)
          PY
      - name: Compile with Swift 6.0
        run: |
          sources=()
          while IFS= read -r -d '' file; do
            sources+=("$file")
          done < <(find Sources/DMVariableBlurView -name '*.swift' -print0)
          xcrun --sdk iphonesimulator swiftc \
            -target arm64-apple-ios17.0-simulator \
            -sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" \
            -module-name DMVariableBlurView \
            -package-name DMVariableBlurView \
            -swift-version 6 -enable-upcoming-feature ExistentialAny \
            -O -parse-as-library -whole-module-optimization -warnings-as-errors \
            -c -o "$RUNNER_TEMP/DMVariableBlurView.o" \
            "${sources[@]}"

  consumer:
    name: consumer
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A check that never fails looks the same as a clean tree, so its readers are tried on texts
      # that must fail before they are trusted with the real ones.
      - name: Check the readers of the manifest, of the README and of Package.resolved
        run: Scripts/check-manifest.sh --self-test
      - name: Check what a consumer gets
        run: Scripts/check-manifest.sh

  api:
    # The interface text depends on the compiler, so this job runs on one pinned Xcode.
    name: api
    runs-on: macos-26
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the normalisation of the interface
        run: Scripts/check-api.sh --self-test
      # The release check refuses a release on what it reads in the changelog, the tags and the
      # baselines. A check that never refuses looks the same as a clean tree, so its decisions are
      # tried on scratch repositories first.
      - name: Check the decisions of the release check
        run: Scripts/check-release.sh --self-test
      - name: Compare the public interface with the baseline
        run: Scripts/check-api.sh
      # What the pull request removes, changes or adds in the baseline, for the reviewer. The
      # comparison above is the one that fails; this step fails only when it cannot compare. The
      # text is indented as a code block: a line of a fork's baseline could close a fence.
      - name: Write the interface delta against the base to the job summary
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          status=0
          Scripts/check-api.sh --since "$BASE_SHA" > "$RUNNER_TEMP/delta.txt" 2>&1 || status=$?
          {
            echo "### Public interface against the base of the pull request"
            echo
            sed 's/^/    /' "$RUNNER_TEMP/delta.txt"
          } >> "$GITHUB_STEP_SUMMARY"
          case "$status" in
            0 | 3 | 4) ;;
            1)
              if ! grep -q '^Removed or changed' "$RUNNER_TEMP/delta.txt"; then
                cat "$RUNNER_TEMP/delta.txt" >&2
                exit 1
              fi
              ;;
            *)
              cat "$RUNNER_TEMP/delta.txt" >&2
              exit "$status"
              ;;
          esac

  # The pod is frozen at 1.1.0 and nothing goes to the trunk again. The job lints the current
  # sources as a pod and checks what a consumer of it would link.
  podspec:
    name: podspec
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint the podspec and check what a consumer links
        run: Scripts/check-podspec.sh

  docs:
    name: docs
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A broken symbol link is a warning to DocC and an error here.
      - name: Build the documentation
        run: |
          xcodebuild docbuild \
            -scheme DMVariableBlurView \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            OTHER_DOCC_FLAGS="--warnings-as-errors"

  example:
    name: example (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iOS 26.5
            runner: macos-26
            xcode: /Applications/Xcode_26.6.app
            device: iPhone 17
            os: "26.5"
            newest: true
            passed: 20
            skipped: 0
          - name: iOS 18.5
            runner: macos-15
            xcode: /Applications/Xcode_16.4.app
            device: iPhone 16
            os: "18.5"
            newest: false
            # This runtime has no snapshot references, so the five snapshot tests are skipped.
            passed: 15
            skipped: 5
    env:
      DEVELOPER_DIR: ${{ matrix.xcode }}/Contents/Developer
      # xcodebuild hands a variable with this prefix to the test process without the
      # prefix. The snapshot tests see CI: they never record a reference, and a runtime
      # without references skips them, except in the newest cell, which has references
      # and must compare them: there a missing reference fails.
      TEST_RUNNER_CI: "true"
      TEST_RUNNER_SNAPSHOT_REFERENCES_REQUIRED: ${{ matrix.newest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The device comes from the script, as in the test job.
      - name: Prepare the simulator
        env:
          DEVICE: ${{ matrix.device }}
          OS: ${{ matrix.os }}
        run: |
          udid="$(Scripts/prepare-simulator.sh "$DEVICE" "$OS")"
          echo "SIMULATOR=$udid" >> "$GITHUB_ENV"
      # Only the committed package versions: a resolved file that no longer matches the
      # project fails here instead of being resolved again to whatever is newest.
      - name: Build the example and run its tests
        run: |
          set -o pipefail
          mkdir -p .build/results/ci
          xcodebuild test \
            -project Examples/DMVariableBlurViewExample/DMVariableBlurViewExample.xcodeproj \
            -scheme DMVariableBlurViewExample \
            -destination "platform=iOS Simulator,id=$SIMULATOR" \
            -onlyUsePackageVersionsFromResolvedFile \
            -resultBundlePath .build/results/ci/example.xcresult \
            | tee .build/results/ci/example.log
      # A run that runs no test passes, and so does one that skips what it should run. The
      # numbers of the matrix are what the example has in this cell, so a lost test or a run that
      # skips everything fails here. A new example test changes them, in the same commit.
      - name: Check how many tests ran
        env:
          EXPECTED_PASSED: ${{ matrix.passed }}
          EXPECTED_SKIPPED: ${{ matrix.skipped }}
        run: |
          xcrun xcresulttool get test-results summary --path .build/results/ci/example.xcresult \
            > "$RUNNER_TEMP/example-summary.json"
          python3 - "$RUNNER_TEMP/example-summary.json" "$EXPECTED_PASSED" "$EXPECTED_SKIPPED" <<'PY'
          import json
          import sys

          summary = json.load(open(sys.argv[1]))
          expected = {"passedTests": int(sys.argv[2]), "skippedTests": int(sys.argv[3]), "failedTests": 0}
          actual = {key: summary.get(key) for key in expected}
          if actual != expected:
              print(f"example: the tests that ran are not the ones this cell expects: expected {expected}, got {actual}")
              sys.exit(1)
          print(f"example: {actual['passedTests']} tests passed and {actual['skippedTests']} were skipped, as expected.")
          PY
      # Xcode compiles a package dependency with its warnings suppressed, so the build
      # cannot turn warnings into errors as a whole. The library's own warnings fail the
      # test job; this step covers the sources of the example.
      - name: Fail on a warning in the example
        run: |
          warnings="$(grep -E "/Examples/[^:]*:[0-9]+:[0-9]+: warning:" .build/results/ci/example.log | sort -u || true)"
          if [ -n "$warnings" ]; then
            echo "$warnings"
            exit 1
          fi
      - name: Find unused imports
        if: matrix.newest
        run: Scripts/lint.sh --analyze .build/results/ci/example.log
      - name: Upload the result bundle
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: example-${{ matrix.runner }}-xcresult
          path: .build/results/ci/example.xcresult
