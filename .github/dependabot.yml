# The actions of the workflows are pinned to commits. Dependabot proposes the newer ones.
# No entry watches DMCore, the one dependency of the package, which the manifest requires as a
# range, and the snapshot library of the example's tests is pinned to an exact release that is
# changed by hand. The tools manifest in Tools/ pins DMDevKit, and Dependabot proposes its newer
# releases too.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # A release of an action is proposed a week after it appears, not on the day it does.
    cooldown:
      default-days: 7
    # One pull request a week for all the minor and patch updates, so that a merge to main does
    # not make Dependabot rebase several of them at once. A major update stays a pull request of
    # its own: it needs its own lines in the changelog.
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: swift
    directory: /Tools
    schedule:
      interval: weekly
    # A release of DMDevKit is proposed a week after it appears, as for an action.
    cooldown:
      default-days: 7
    # As above: minor and patch updates in one pull request, a major one on its own.
    groups:
      swift:
        patterns: ["*"]
        update-types: ["minor", "patch"]
