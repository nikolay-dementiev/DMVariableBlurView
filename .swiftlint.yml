swiftlint_version: 0.65.1

included:
  - Sources
  - Tests
  - Examples
  - Fixtures

opt_in_rules:
  - force_unwrapping
  - implicitly_unwrapped_optional
  - missing_docs

analyzer_rules:
  - unused_import

# By default the rule skips a type that inherits or conforms, and everything inside it:
# here that would leave out both views of the library.
missing_docs:
  excludes_inherited_types: false

# By default the rule lets a few calls with a literal argument be force unwrapped, such as
# URL(string: "https://example.com")!. ENGINEERING.md states no exception, so the list is empty.
force_unwrapping:
  ignored_literal_argument_functions: []

identifier_name:
  min_length: 2
  allowed_symbols: [_]

file_length:
  warning: 600
  error: 1000

type_body_length:
  warning: 500
  error: 1000

function_parameter_count:
  warning: 6
  error: 10

line_length:
  warning: 130
  error: 200

# The patterns are matched against the absolute path. They name the module folder, so that a checkout
# under a parent folder called Examples or Fixtures cannot switch a rule off, and so that the example
# app and the consumer fixture, whose modules have other names, stay out of reach.
custom_rules:
  domain_imports:
    name: "Domain imports"
    included: ".*/Sources/DMVariableBlurView/Domain/.*\\.swift"
    # Any attribute, access level and import kind; a second import after a semicolon; a
    # submodule of Foundation or CoreGraphics is allowed. Comments and strings never match.
    # Not seen: an import with a comment inside it or after a block comment on its line, and a
    # module name in backticks.
    # CoreGraphics is allowed for its scalar types, such as CGFloat, and not for its objects or
    # its functions. The rule checks the import only, so the reviewer applies that part
    # (ENGINEERING.md, "The package as it is").
    regex: '(?:^|;)[ \t]*(@\w+(\([^)]*\))?\s+)*((public|package|internal|fileprivate|private)\s+)?import\s+(?:(?:struct|class|enum|protocol|typealias|func|var|let)\s+)?+(?!(?:CoreGraphics|Foundation)\b)\w+'
    match_kinds: [keyword, identifier, attribute.builtin, attribute.id]
    message: "The Domain folder imports only Foundation and CoreGraphics: no UI and no rendering framework."
    severity: error
  no_process_termination:
    name: "No process termination"
    included: ".*/Sources/DMVariableBlurView/.*\\.swift"
    regex: '\b(fatalError|preconditionFailure|assertionFailure|precondition|assert|dispatchPrecondition|abort|exit)\s*\('
    match_kinds: [identifier]
    message: "A library never terminates its host. Report the failure to the caller."
    severity: error
