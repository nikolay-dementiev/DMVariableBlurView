swiftlint_version: 0.65.1

included:
  - Sources
  - Tests
  - Examples
  - Fixtures

opt_in_rules:
  - force_unwrapping
  - implicitly_unwrapped_optional

analyzer_rules:
  - unused_import

identifier_name:
  min_length: 2
  allowed_symbols: [_]

file_length:
  warning: 600
  error: 1000

type_body_length:
  warning: 500
  error: 1000

function_parameter_count:
  warning: 6
  error: 10

line_length:
  warning: 130
  error: 200

custom_rules:
  domain_imports:
    name: "Domain imports"
    included: "Sources/.*/Domain/.*\\.swift"
    # Any attribute, access level and import kind; a second import after a semicolon; a
    # submodule of Foundation or CoreGraphics is allowed. Comments and strings never match.
    regex: '(?:^|;)\s*(@\w+(\([^)]*\))?\s+)*((public|package|internal|fileprivate|private)\s+)?import\s+(?:(?:struct|class|enum|protocol|typealias|func|var|let)\s+)?+(?!(?:CoreGraphics|Foundation)\b)\w+'
    match_kinds: [keyword, identifier, attribute.builtin, attribute.id]
    message: "The Domain folder imports only Foundation and CoreGraphics: no UI and no rendering framework."
    severity: error
  no_termination:
    name: "No termination"
    included: "Sources/.*\\.swift"
    regex: '\b(fatalError|preconditionFailure|assertionFailure)\s*\('
    match_kinds: [identifier]
    message: "Library code never stops the host: return nil, throw, or record a failure instead."
    severity: error
