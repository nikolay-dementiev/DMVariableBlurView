swiftlint_version: 0.65.1

included:
  - Sources
  - Tests
  - Examples
  - Fixtures

opt_in_rules:
  - force_unwrapping
  - implicitly_unwrapped_optional

analyzer_rules:
  - unused_import

identifier_name:
  min_length: 2
  allowed_symbols: [_]

file_length:
  warning: 600
  error: 1000

type_body_length:
  warning: 500
  error: 1000

function_parameter_count:
  warning: 6
  error: 10

line_length:
  warning: 130
  error: 200
